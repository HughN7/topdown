[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topdown-arch"
version = "0.5.0"
description = "Universal tree-sitter AST engine and opt-in boundary checker for Topdown"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.23.0",
    "tree-sitter-language-pack>=0.7.0",
]

[project.scripts]
topdown = "engine.cli:main"

[tool.setuptools.packages.find]
include = ["engine*"]
